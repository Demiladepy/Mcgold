# Single web service: MCP HTTP server (Express + Streamable MCP). Same repo includes the
# Next.js landing (`app/`, `npm run dev`/`build`/`start`), which is deployed separately on Vercel;
# Render must NOT run `next start` here.
#
# Start command must be ONLY `npm run start:mcp` (no `&& npm start`). If Render's port scan
# fails, it may fall back to `npm start` (Next.js) — see src/index.ts listen(host 0.0.0.0).
# Dashboard Settings → Build & Deploy → Start Command should match this file.
services:
  - type: web
    name: solana-intel-mcp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:mcp
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_HOSTS
        sync: false
      - key: GOLDRUSH_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: MCPAY_RECIPIENT_WALLET
        sync: false
      # Not read by src/index.ts or payment.ts (clients use MCPAY_KEYPAIR_PATH). Optional placeholder.
      - key: MCPAY_KEYPAIR_JSON
        sync: false
